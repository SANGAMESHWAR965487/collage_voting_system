<!DOCTYPE html>
<html>
<head>
    <title>College Voting Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-wrapper {
            display: flex;
            background: linear-gradient(145deg, #1e1e2f 0%, #16213e 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(100, 100, 255, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(100, 100, 255, 0.2);
        }
        
        .login-image {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .login-image::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(168, 192, 255, 0.4);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }
        
        .login-image::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(168, 192, 255, 0.3);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite 0.5s;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }
        
        .login-image-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
        }
        
        .login-image h1 {
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .login-image p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 25px;
        }
        
        .link-btn {
            display: inline-block;
            padding: 14px 35px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .login-form {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(145deg, #1e1e2f 0%, #16213e 100%);
        }
        
        .login-form h2 {
            color: #e0e0e0;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .login-form .subtitle {
            color: #8888aa;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            color: #ccccdd;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 45px;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #0f0f1e;
            color: #e0e0e0;
        }
        
        .form-group input::placeholder {
            color: #555577;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #151528;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2),
                        0 0 20px rgba(102, 126, 234, 0.2);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            color: #8888aa;
            font-size: 18px;
            user-select: none;
        }
        
        .password-toggle:hover {
            color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5),
                        0 0 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        .btn:disabled {
            background: #555577;
            cursor: not-allowed;
            transform: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #8888aa;
            font-size: 14px;
        }
        
        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .link:hover {
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .message-error {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6666;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }
        
        .message-success {
            background: rgba(100, 255, 150, 0.2);
            color: #66ff99;
            border: 1px solid rgba(100, 255, 150, 0.3);
        }
        

        
        @media (max-width: 768px) {
            .login-image {
                display: none;
            }
            
            .login-form {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-image">
            <div class="login-image-content">
                <h1>College Voting</h1>
                <p>Secure Your Voice</p>
                <a href="/register" class="link-btn">Register Here</a>
            </div>
        </div>
        
        <div class="login-form">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to cast your vote</p>

{% if otp_pending %}
            <p class="subtitle">Enter the six-digit code sent to your registered email. It expires after 5 minutes.</p>
            <form method="POST" action="/verify_otp">
                <div class="form-group">
                    <label for="otp">Verification code</label>
                    <input type="text" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                </div>
                <button type="submit" class="btn">Verify code</button>
            </form>
            <form method="POST" action="/resend_otp">
                <button type="submit" class="btn">Resend code</button>
            </form>
            <p class="footer"><a href="/logout" class="link">Cancel</a></p>
{% else %}
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="rollno">Roll No</label>
                    <input type="text" id="rollno" name="rollno" placeholder="Enter Roll No" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number (admin login only)</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Optional for students">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
{% endif %}

            <p class="footer">
                New voter? <a href="/register" class="link">Register Here</a>
            </p>

            {% if message %}
            <div class="message {% if success_message %}message-success{% else %}message-error{% endif %}">
                {{ message }}
            </div>
            {% endif %}
        </div>
    </div>
    
    <script>
        function togglePassword() {
            var passwordInput = document.getElementById('password');
            var toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
