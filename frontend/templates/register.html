<!DOCTYPE html>
<html>
<head>
    <title>College Voting Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-wrapper {
            display: flex;
            background: linear-gradient(145deg, #1e1e2f 0%, #16213e 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(100, 100, 255, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            position: relative;
            border: 1px solid rgba(100, 100, 255, 0.2);
        }
        
        .login-image {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .login-form {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
            background: linear-gradient(145deg, #1e1e2f 0%, #16213e 100%);
        }
        
        .login-image::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(168, 192, 255, 0.4);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }
        
        .login-image::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(168, 192, 255, 0.3);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite 0.5s;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }
        
        .login-image-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
        }
        
        .login-image h1 {
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .login-image p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 25px;
        }
        
        .link-btn {
            display: inline-block;
            padding: 14px 35px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 20px rgba(102, 126, 234, 0.4);
        }
        
        .link-btn:hover::before {
            left: 100%;
        }
        
        .link-btn:active {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5), 0 0 30px rgba(102, 126, 234, 0.4);
        }
        
        .login-form h2 {
            color: #e0e0e0;
            margin-bottom: 10px;
            font-size: 28px;
            position: relative;
            display: inline-block;
        }
        
        .login-form h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .login-form .subtitle {
            color: #8888aa;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            color: #ccccdd;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 45px;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #0f0f1e;
            color: #e0e0e0;
        }
        
        .form-group input::placeholder {
            color: #555577;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #151528;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2),
                        0 0 20px rgba(102, 126, 234, 0.3);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            color: #8888aa;
            font-size: 18px;
            user-select: none;
        }
        
        .password-toggle:hover {
            color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5),
                        0 0 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5),
                        0 0 30px rgba(102, 126, 234, 0.4);
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #8888aa;
            font-size: 14px;
        }
        
        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .link:hover {
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        .link:active {
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .message-error {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6666;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }
        
        .message-success {
            background: rgba(100, 255, 150, 0.2);
            color: #66ff99;
            border: 1px solid rgba(100, 255, 150, 0.3);
        }
        
        @media (max-width: 768px) {
            .login-image {
                display: none;
            }
            
            .login-form {
                padding: 40px 30px;
            }
            
            .login-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-image">
            <div class="login-image-content">
                <h1>Join Us</h1>
                <p>Register to Vote</p>
                <a href="/" class="link-btn">Login Here</a>
        </div>
        
        <div class="login-form">
            <h2>Create Account</h2>
            <p class="subtitle">Register to cast your vote</p>

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="rollno">Roll Number</label>
                    <input type="text" id="rollno" name="rollno" placeholder="Enter your roll number" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>
                </div>

                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter email ID" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                </div>

                <button type="submit" class="btn">Register</button>
            </form>
            
            <p class="footer">
                Already registered? <a href="/" class="link">Login Here</a>
            </p>
            
            {% if message %}
            <div class="message message-error">
                {{ message }}
            </div>
            {% endif %}
        </div>
    </div>
    
    <script>
        function togglePassword() {
            var passwordInput = document.getElementById('password');
            var toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
